page_subtitle: A list of releases involving Yuzuru
cover:
  url: ../assets/graphics/yuzuru_violin.png
  alt: Yuzuru Fushimi playing the violin
main:
  content:
    - Welcome to the discography page! This page contains all Ensemble Stars songs featuring Yuzuru Fushimi listed from the newest to oldest. Starting Season 5 (April 2024), Happy Elements has made the decision to cease releasing physical copies of singles. The news was followed with an announcement of the company removing region lock on most Ensemble Stars songs (excluding cover songs, due to copyright), making them available worldwide.
    - "**Note: This page only lists releases featuring Yuzuru, minus anniversary songs. Single or EP releases will link to the track instead.**"
